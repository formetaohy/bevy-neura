[workspace]
resolver = "3"

[workspace.package]
version = "0.7.4"
edition = "2024"
description = "Neura integration for Bevy"
license = "MIT"
repository = "https://github.com/formetaohy/bevy-neura"

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "bevy-neura"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded", "bevy_render"] }
neura = "0.7.4"
neura-abi = "0.7.4"
wgpu = { version = "29", default-features = false, features = ["std", "dx12", "metal", "vulkan"] }

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "system_font_discovery"] }
cpal = "0.18"
flate2 = "1.1.10"
hound = "3.5"
rustfft = "6"
safetensors = "0.8"
serde_json = "1"
