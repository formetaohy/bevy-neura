[workspace]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
description = "Neura integration for Bevy"
license = "MIT"
repository = "https://github.com/formetaohy/bevy-neura"

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "bevy-neura"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded"] }
neura = "0.6.0"
neura-abi = "0.6.0"

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "system_font_discovery"] }
cpal = "0.18"
hound = "3.5"
rustfft = "6"
safetensors = "0.8"
serde_json = "1"
