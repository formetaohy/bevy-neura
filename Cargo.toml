[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Neura integration for Bevy"
license = "MIT"
repository = "https://github.com/formetaohy/bevy-neura"

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "bevy-neura"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "multi_threaded"] }
neura = "0.5.0"
neura-abi = "0.5.0"
neura-graph = "0.5.0"
pollster = "0.4"

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
